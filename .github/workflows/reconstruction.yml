name: Judge setup and reconstruction
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/setup-judges.sh'
      - '.github/workflows/reconstruction.yml'
      - 'README.md'
      - 'REPRODUCE.md'
      - 'HACKATHON_SCOPE.md'
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct pinned source and run tests/build
        run: bash scripts/setup-judges.sh test
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-meta-build
          path: .reconstructed-tuka/.build/meta/
          if-no-files-found: ignore
